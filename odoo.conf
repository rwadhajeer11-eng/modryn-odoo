[options]
; --- Where Odoo finds code -------------------------------------------------
; Core first, our addons second. Odoo core is NEVER edited; everything we add
; lives in ./addons and reaches core through model/view inheritance.
addons_path = /Users/mrwen/Documents/Github/modryn-odoo/odoo/addons,/Users/mrwen/Documents/Github/modryn-odoo/addons

; --- Runtime data ----------------------------------------------------------
; Filestore lives inside the repo dir (gitignored) so new_boutique.sh can copy
; a tenant's attachments with a plain `cp -R`.
data_dir = /Users/mrwen/Documents/Github/modryn-odoo/.odoo-data

; --- Database --------------------------------------------------------------
; db_host is a STRING in Odoo 19 (`False` logs a warning and is ignored).
; Leaving it empty makes libpq use the local unix socket — what Homebrew
; postgres serves on /tmp/.s.PGSQL.5432.
db_host =
db_user = mrwen

; THE TENANCY ROUTER. %d is the first hostname label, so:
;   bella.localtest.me:8069 -> database "bella"
;   noga.localtest.me:8069  -> database "noga"
; One PostgreSQL database per boutique: isolation by construction, no RLS needed.
dbfilter = ^%d$

; PoC only — the database manager stays reachable at localhost:8069/web/database/manager
; for inspection. Production sets this False (it exposes create/drop/backup).
list_db = True

; --- HTTP ------------------------------------------------------------------
http_port = 8069
; Threaded mode: on macOS dev this serves the bus.bus websocket in-process,
; which the realtime probe (modryn_queue_poc) needs. Prod uses workers > 0
; plus a gevent port for the bus.
workers = 0

; --- Dev -------------------------------------------------------------------
log_level = info
