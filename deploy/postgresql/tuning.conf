# MODRYN PostgreSQL 16 tuning.
#
# Installed to /etc/postgresql/16/main/conf.d/modryn.conf, which Ubuntu's
# packaging already pulls in via `include_dir = 'conf.d'`.
#
# ONLY overrides live here. Never replace postgresql.conf wholesale: the next
# point release ships a new one, and settings that were never ours to own get
# silently reverted with it.
#
# Sizing assumes a 16c/32t, 128 GB box. CONFIRM THE BOX ACTUALLY HAS 128 GB
# before applying shared_buffers — on a 32 GB machine these numbers make
# Postgres refuse to start.
#
# Settings marked (restart) need `systemctl restart postgresql`; the rest take
# `systemctl reload postgresql`.

# --- Networking ------------------------------------------------------------
# (restart) Unix socket ONLY. With no TCP listener there is no network attack
# surface and no database password to leak — peer auth over the socket is the
# whole credential. This is also why db_host is empty in odoo.conf, and the
# reason managed Postgres was rejected: it puts the database behind TCP and
# takes the socket away.
listen_addresses = ''

# --- Memory ----------------------------------------------------------------
# (restart) ~19% of 128 GB, deliberately BELOW the conventional 25%. Measured
# tenant size is ~80 MB, so 100 boutiques is ~8 GB — the entire multi-tenant
# working set fits in a third of this at any plausible tenant count. Buying
# more shared_buffers past that point just takes RAM away from the OS page
# cache, which is doing the same job with less bookkeeping.
shared_buffers = 24GB

# Planner hint only; allocates nothing. Conservative given ~80 GB is genuinely
# free after the app's ~16 GB and shared_buffers' 24 GB. Setting it too LOW is
# the expensive mistake: the planner then assumes cold reads and chooses
# sequential scans over index scans.
effective_cache_size = 64GB

# PER SORT/HASH NODE, not per connection — one query with three sorts uses
# three of these. Worst case ~250 conns x 16 MB x 2 nodes = 8 GB, which fits.
work_mem = 16MB

# Makes the nightly VACUUM/ANALYZE and any REINDEX finish in a window rather
# than overnight. Only a handful of processes ever use it at once.
maintenance_work_mem = 2GB

# --- Connections -----------------------------------------------------------
# (restart) The Odoo ceiling is 212, not 192:
#   db_maxconn is a PER-PROCESS pool (odoo/odoo/sql_db.py builds a module-global
#   _Pool per OS process), and prefork runs cron workers and the gevent worker
#   as separate processes:
#     48 http x 4 + 4 cron x 4 + 1 gevent x 4 = 212
# 250 minus 3 superuser-reserved leaves ~35 for psql, pg_dump and monitoring.
#
# Do NOT raise `workers` in odoo.conf without redoing this sum. And note that
# setting db_replica_host in odoo.conf creates a SECOND pool per process,
# doubling the Odoo ceiling to 424 — a read replica is a max_connections
# change, not just one config line.
max_connections = 250

# --- Storage -------------------------------------------------------------
# NVMe. The 4.0 default models a spinning-disk seek that does not exist on this
# hardware and pushes the planner towards sequential scans it should not pick.
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL and checkpoints ---------------------------------------------------
# Cheap CPU on a 16-core box, and it shrinks both the WAL and the base backups.
wal_compression = on

# Spread checkpoint I/O across 90% of the interval instead of stalling every
# request that touches a dirty page at the end of it.
checkpoint_completion_target = 0.9
# Default 1GB forces frequent checkpoints under write bursts (a ramp stage, a
# module upgrade across every tenant). (restart-free, but takes effect at the
# next checkpoint.)
max_wal_size = 8GB
min_wal_size = 2GB

# --- Observability ---------------------------------------------------------
# (restart) pg_stat_statements is the instrument that turns "the floor board is
# slow" into "this one lookup ran 14,000 times in a 15-minute window". The
# load-test plan's server-side evidence depends on it, and it is not loaded by
# default — verified empty on the dev box.
#
# The library must be preloaded here AND the extension created per database:
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# build_template_prod.sh creates it in modryn_template, so every tenant cloned
# with `createdb -T` inherits it without a second thought.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# Log any statement slower than a second. At 200-400 req/s an "all statements"
# log is itself a performance problem, so this is a threshold, not a firehose.
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0        # any temp file at all means work_mem was too small
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '

# --- Autovacuum ------------------------------------------------------------
# calendar_event and the queue tables churn: bookings are created, confirmed and
# cancelled all day. The 0.2 default lets 20% of a table become dead tuples
# before a vacuum, which on a hot small table is a lot of wasted page reads.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_max_workers = 4

# --- Timezone --------------------------------------------------------------
# UTC everywhere, matching TZ=UTC in the systemd unit. A database in
# Asia/Jerusalem and an app in UTC disagree twice a year, for one hour, in a way
# that looks like a booking bug.
timezone = 'UTC'
log_timezone = 'UTC'
