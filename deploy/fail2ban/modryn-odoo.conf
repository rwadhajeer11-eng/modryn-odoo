# /etc/fail2ban/filter.d/modryn-odoo.conf
#
# Matches the ONE line Odoo 19 logs on a failed password login. Verified against
# this tree, odoo/odoo/addons/base/models/res_users.py:
#
#     _logger.info("Login failed for login:%s from %s", login, ip)
#
# NOTE there is NO `db:` field in Odoo 19 — an older filter written as
# `Login failed for db:\S+ login:\S+ from <HOST>` matches nothing here, and
# fail2ban reports the jail as healthy while banning nobody.
#
# WHY THIS IS NOT ANCHORED ON `^Login failed`
# -------------------------------------------
# That message is only the TAIL of the line fail2ban is handed. Odoo formats
# every record with (odoo/odoo/netsvc.py):
#
#     '%(asctime)s %(pid)s %(levelname)s %(dbname)s %(name)s: %(message)s %(perf_info)s'
#
# and fail2ban's systemd backend prepends the host and the syslog identifier.
# The real line, reconstructed from that format string, is:
#
#   modryn-box modryn[12345]: 2026-08-11 01:06:56,919 12345 INFO bella \
#   odoo.addons.base.models.res_users: Login failed for login:manager from 203.0.113.9
#
# (with a trailing space: perf_info is "" for non-werkzeug records). A regex
# anchored `^Login failed ...` matches NONE of that, and the failure is silent —
# jail running, filter loaded, zero bans, forever. §8 check 7 of
# deploy/README.md now proves the match with fail2ban-regex instead of assuming
# it; run it after ANY change to this file or to Odoo's log format.
#
# The left bound is the LOGGER NAME, which pins the match to this one call site
# and survives any change to hostname, pid, level or database name.
#
# `[\s\S]*` rather than `.*` or `\S*`, and the `$` anchor, are both load-bearing:
# `login` is ATTACKER-CONTROLLED (it is the submitted form field), so the message
# can be made to contain a second " from <ip>".
#   - `\S*` refuses to span a space, so a login of "x from 8.8.8.8" makes the
#     regex fail entirely and the attacker is never banned.
#   - `[\s\S]*` is greedy and `$` pins the capture to the LAST " from <host>" in
#     the line, which is always the genuine remote address werkzeug supplied.
#   - `[\s\S]` rather than `.` because a newline inside `login` would otherwise
#     split the line beyond the reach of `.` (fail2ban compiles failregex with
#     no DOTALL and no MULTILINE), which is the same evasion by another route.
# Tested against all four of those inputs: every one yields host=203.0.113.9.
#
# Two further preconditions, both easy to break by accident:
#   1. odoo.conf must carry `log_handler = odoo.addons.base.models.res_users:INFO`.
#      `log_level = warn` alone sets odoo:WARNING and SUPPRESSES this INFO line.
#   2. nginx must send X-Forwarded-Host and odoo.conf must set proxy_mode = True,
#      or <HOST> is 127.0.0.1 for every failure and this jail bans nginx —
#      taking the whole platform down on the sixth wrong password.
[Definition]
failregex = ^[\s\S]*odoo\.addons\.base\.models\.res_users: Login failed for login:[\s\S]* from <HOST>\s*$
ignoreregex =
journalmatch = SYSLOG_IDENTIFIER=modryn
