# /etc/fail2ban/jail.d/modryn.conf
#
# Covers /staff/login only. That endpoint goes through
# request.session.authenticate -> res.users._login, which is the code path that
# emits the line the filter matches.
#
# /my/login is phone-OTP and does NOT go through res.users, so fail2ban cannot
# see it. Its only protection is the modryn_otp rate-limit zone in nginx — worth
# knowing before someone reads this jail as covering "all logins".

[modryn-odoo]
enabled  = true
filter   = modryn-odoo
backend  = systemd
journalmatch = SYSLOG_IDENTIFIER=modryn
# banaction inherits from jail.local / DEFAULT (nftables on Ubuntu 24.04).
port     = http,https
# Six wrong passwords in ten minutes is a script, not a tired employee opening
# the terminal on a Sunday morning. One hour is long enough to be discouraging
# and short enough that a real member of staff is not locked out for the shift.
maxretry = 6
findtime = 600
bantime  = 3600

[sshd]
enabled  = true
maxretry = 5
findtime = 600
bantime  = 86400
