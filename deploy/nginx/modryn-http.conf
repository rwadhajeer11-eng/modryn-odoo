# MODRYN — nginx http{}-level configuration.
#
# Installed to /etc/nginx/conf.d/modryn-http.conf. Ubuntu's stock nginx.conf
# includes conf.d/*.conf BEFORE sites-enabled/*, which is the ordering this
# file depends on: upstreams, maps, limit_req zones and log_format must all be
# defined before the server blocks in modryn-site.conf reference them.
#
# __DOMAIN__ is substituted by provision.sh from DOMAIN in /etc/modryn/deploy.env.

# --- Upstreams -------------------------------------------------------------
# 8069 = the prefork HTTP workers. 8072 = the gevent process that PreforkServer
# spawns itself. Both bind 127.0.0.1 only (http_interface in odoo.conf).
upstream modryn_odoo {
    server 127.0.0.1:8069;
    # keepalive needs proxy_http_version 1.1 + `Connection ""`, both set below.
    # Without it every proxied request opens a new TCP connection to a Python
    # worker, which shows up as latency that no amount of worker tuning fixes.
    keepalive 64;
}

upstream modryn_odoo_chat {
    server 127.0.0.1:8072;
    keepalive 32;
}

# --- Access log ------------------------------------------------------------
# The load-test spec takes its SERVER-SIDE latency from this format, so the
# field names are a contract with the harness, not a preference.
#
# $request_time minus $upstream_response_time is the queueing-plus-network
# share. When the generator reports 3 s and $upstream_response_time is 200 ms,
# the bottleneck is in FRONT of Odoo (worker saturation, accept backlog) — a
# completely different fix from a slow page build. host=$host is what attributes
# a slow request to a tenant.
log_format modryn_load
    '$time_iso8601 host=$host status=$status '
    'rt=$request_time urt=$upstream_response_time '
    'method=$request_method uri=$uri '
    'bytes=$body_bytes_sent ua_status=$upstream_status '
    'conn=$connection_requests';

access_log /var/log/nginx/modryn.log modryn_load;

# --- Known tenants ---------------------------------------------------------
# tenants.map is GENERATED from the db_name line in /etc/odoo/odoo.conf by
# deploy/scripts/gen_tenants_map.sh — one source of truth, so a tenant cannot
# exist in nginx but not in Odoo's cron enumerator, or the reverse.
map $host $modryn_tenant_known {
    default 0;
    include /etc/nginx/tenants.map;
}

# --- Rate limiting ---------------------------------------------------------
# Keyed on the client IP, EXCEPT where the key is deliberately blanked below.
#
# THE LOAD GENERATOR MUST BE EXEMPT during a ramp. Without the exemption the
# campaign measures nginx's 429 rate and reports it as an Odoo capacity
# ceiling — an afternoon of tuning `workers` against a limit that lives in this
# file. nginx skips limit_req entirely when the key evaluates to the empty
# string, which is the mechanism used here.
geo $modryn_limit_exempt {
    default 0;
    127.0.0.1/32 1;   # verify.sh drives /staff/login from the box itself
    ::1/128      1;
    # Written by provision.sh; add the ramp generator's address here, reload,
    # and REMOVE IT AGAIN when the campaign finishes.
    include /etc/nginx/modryn-loadgen-exempt.conf;
}

map $modryn_limit_exempt $modryn_limit_key {
    0 $binary_remote_addr;
    1 "";             # empty key => this request is not accounted at all
}

# Israeli mobile carriers CGNAT heavily, so a whole neighbourhood can share one
# exit address. These are deliberately loose: the goal is to stop a script, not
# to police a shared address. If the 429 counter is non-zero outside a ramp,
# these numbers are too tight for real traffic — raise them, do not celebrate.
limit_req_zone $modryn_limit_key zone=modryn_post:10m rate=10r/m;
limit_req_zone $modryn_limit_key zone=modryn_otp:10m  rate=5r/m;
limit_req_status 429;

# --- Proxy defaults --------------------------------------------------------
# http-level so every server and location inherits them.
#
# TRAP: nginx inherits proxy_set_header from the enclosing level ONLY IF the
# current level declares no proxy_set_header of its own. Any location that adds
# one header LOSES ALL of these. The /websocket location therefore repeats the
# whole set — see modryn-site.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";          # required for upstream keepalive

# X-Forwarded-Host is NOT optional and NOT decorative. Odoo's entire ProxyFix
# block is gated on environ.get("HTTP_X_FORWARDED_HOST") (odoo/odoo/http.py);
# without this header `proxy_mode = True` silently does nothing, every request
# is logged as plain HTTP from 127.0.0.1, generated absolute URLs are wrong, and
# the fail2ban jail bans nginx on the sixth failed login.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;

# Dress photography. Odoo has its own body limits; this is the one that has to
# be raised first, because nginx rejects with 413 before Odoo sees the request.
client_max_body_size 64m;

# Longer than limit_time_real (240 s) in odoo.conf, so Odoo's own limit fires
# first and logs which request was the culprit. If nginx times out first, all
# the evidence is a 504 with no name attached.
proxy_read_timeout 300s;

# --- Compression -----------------------------------------------------------
# Measured: Odoo does NOT compress. A request to /shop with Accept-Encoding:
# gzip comes back with no Content-Encoding, and the frontend CSS bundle alone
# is 995,309 bytes uncompressed. gzip here is not an optimisation, it is the
# difference between a ~1 MB and a ~120 KB cold page on an Israeli mobile
# connection.
gzip              on;
gzip_vary         on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_proxied      any;
# text/html is always gzipped by nginx and must not be listed here.
gzip_types text/plain text/css text/xml application/javascript
           application/json application/xml image/svg+xml
           application/rss+xml font/woff2 application/manifest+json;

# --- TLS defaults ----------------------------------------------------------
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:50m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling        on;
ssl_stapling_verify on;

# Do not advertise the version to every scanner.
server_tokens off;
