# MODRYN — nginx server blocks.
#
# Installed to /etc/nginx/sites-available/modryn.conf and symlinked into
# sites-enabled/. Depends on conf.d/modryn-http.conf being loaded first
# (upstreams, maps, limit zones, log_format, proxy defaults).
#
# __DOMAIN__ is substituted by provision.sh from DOMAIN in /etc/modryn/deploy.env.
# snippets/modryn-tls.conf holds the two ssl_certificate lines; provision.sh
# points it at a self-signed placeholder so nginx can start BEFORE certbot has
# ever run, and repoints it at Let's Encrypt afterwards. nginx cannot take a
# variable in ssl_certificate, so a swappable include is the only way to make
# the bootstrap ordering work.

# ---------------------------------------------------------------------------
# 1. THE CATCH-ALL. An unknown hostname must die here.
# ---------------------------------------------------------------------------
# Measured on the dev instance, on the *development* hostname scheme:
#     GET http://unknown-tenant.localtest.me:8069/
#       -> 303 /odoo
#       -> 303 /web/database/selector
#       -> 200
# An unknown subdomain that reaches Odoo lands on the DATABASE SELECTOR, which
# lists databases and links to the manager. dbfilter does not save us: it fails
# open into that redirect chain rather than closed into a 404.
#
# So: a default_server that has no proxy_pass anywhere in it. The request never
# reaches Python. This block plus the /web/database/ 404 below are two
# independent defences, because either one alone is a single edit from gone.
server {
    listen 80  default_server;
    listen 443 ssl http2 default_server;
    # nginx 1.24 (Ubuntu 24.04) takes http2 as a `listen` parameter. The
    # separate `http2 on;` directive only exists from 1.25.1 and makes 1.24
    # fail `nginx -t` outright — do not "modernise" this line without checking
    # `nginx -v` on the box first.
    listen [::]:80  default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    include snippets/modryn-tls.conf;

    root /var/www/modryn-static;

    # Nothing here is a real site; keep it out of every index.
    location = /robots.txt {
        root /var/www/modryn-static;
        add_header Cache-Control "public, max-age=3600";
    }

    # Belt-and-braces with the tenant block: even the catch-all refuses the
    # database manager explicitly, so a future edit that accidentally adds a
    # proxy_pass here still does not expose it.
    location ^~ /web/database/ { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / { return 404; }
}

# ---------------------------------------------------------------------------
# 2. Port 80 for real tenants: ACME first, then redirect.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # The bare apex is here only so an HTTP-01 fallback can answer for it. There
    # is no apex site: the redirect lands on the 443 default_server, which 404s.
    server_name ~^[a-z][a-z0-9-]{1,30}\.__DOMAIN__$ __DOMAIN__;

    # Kept even though TLS is issued over DNS-01, so an HTTP-01 fallback works
    # without editing nginx during an outage.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# 3. The tenant site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Same slug grammar new_boutique_prod.sh enforces: lowercase, starts with a
    # letter, 2-31 characters. A hostname outside this shape never matches and
    # falls to the default_server above.
    server_name ~^(?<modryn_tenant>[a-z][a-z0-9-]{1,30})\.__DOMAIN__$;

    include snippets/modryn-tls.conf;

    # HSTS with includeSubDomains is a COMMITMENT: every tenant subdomain
    # becomes HTTPS-only in every browser that has seen this header, for a year,
    # and there is no way to un-say it early. That is intended — every tenant is
    # served by this block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A hostname that MATCHES the slug pattern but has no database still must
    # not reach Odoo, for the same redirect-chain reason as the catch-all.
    # tenants.map is regenerated from odoo.conf's db_name, so this cannot drift
    # away from the set of databases that actually exist.
    if ($modryn_tenant_known = 0) { return 404; }

    # =======================================================================
    # THE LANGUAGE PREFIX. Read this before editing any location below.
    # =======================================================================
    # Every MODRYN route is declared website=True, so Odoo serves each one at
    # BOTH /path and /<lang>/path. It is not a theoretical alias: Odoo renders
    # the prefixed form itself. Measured on the dev instance —
    #     curl -H 'Accept-Language: en-US' http://noga.localtest.me:8069/en/book
    #     -> <form action="/en/book/submit">  and  <form action="/en/waitlist/join">
    # so the browser of an ordinary English-speaking visitor POSTs to the
    # prefixed path. For a POST, http_routing/models/ir_http.py sets
    # allow_redirect = False (method != 'POST'), skips every redirect branch,
    # falls into `url_lang_str == request_url_code` and reroutes internally to
    # the unprefixed path. There is NO 3xx an exact-match location could see.
    #
    # A `location = /book/submit` therefore matches the unprefixed form ONLY,
    # and /en/book/submit reaches Odoo through `location /` with no limit_req
    # at all. Since /book/submit and /waitlist/join each send an SMS and the
    # application's only throttle is per-phone-number (which does not bound an
    # attacker rotating numbers), these limits ARE the defence for the Twilio
    # bill — and the prefixed form removed all of it.
    #
    # `(/[^/]+)?` — one optional leading path segment, NOT a list of language
    # codes. A hardcoded (en|he|ar) drifts the day a boutique owner enables
    # French in website settings, and drifts SILENTLY, in the direction that
    # removes the limit. Odoo inserts exactly one lang segment and never more,
    # so one wildcard segment cannot under-match. It does over-match — a request
    # to /nonsense/book/submit is rate-limited and then 404s in Odoo — and that
    # is the harmless direction.
    #
    # Regex locations are tried IN ORDER and lose to the `^~` prefix blocks
    # below, which is the precedence we want.

    # -----------------------------------------------------------------------
    # Odoo's database manager.
    # -----------------------------------------------------------------------
    # list_db = False blocks the OPERATIONS but leaves every route registered
    # at auth="none", with csrf=False on create / duplicate / drop / backup /
    # restore (odoo/addons/web/controllers/database.py). Their only gate is
    # admin_passwd. Nothing legitimate on this platform ever requests this
    # prefix, so it does not answer.
    #
    # TWO locations for one prefix, deliberately:
    #   - `^~` short-circuits regex evaluation entirely for the bare form, so
    #     no regex location added above it later can ever expose it;
    #   - the regex catches the language-prefixed form, which is the SAME PAGE.
    #     Measured: /web/database/manager and /en/web/database/manager returned
    #     byte-identical 46,329-byte responses (curl + cmp).
    # The optional group makes the regex cover the bare form too, so deleting
    # either line still leaves the prefix closed.
    location ^~ /web/database/ { return 404; }
    location ~ ^(/[^/]+)?/web/database/ { return 404; }

    # -----------------------------------------------------------------------
    # Public POST endpoints — rate limited.
    # -----------------------------------------------------------------------
    # Every path below was checked against addons/*/controllers/*.py and is
    # really registered with auth='public' and methods=['POST']. A limit_req on
    # a path that does not exist is decoration. These six paths plus the three
    # token/id routes are ALL of the auth='public' POST routes in the tree —
    # everything under /manage/ and /staff/lang is auth='user'.
    #
    # The SMS-sending ones are MONEY endpoints, not just compute: each accepted
    # request can put a message on Twilio's bill.

    # /book/submit  — creates a calendar.event, sends a confirmation SMS
    location ~ ^(/[^/]+)?/book/submit$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # /queue/checkin/submit — creates a queue entry
    location ~ ^(/[^/]+)?/queue/checkin/submit$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # /waitlist/join — creates a waitlist row, sends SMS
    location ~ ^(/[^/]+)?/waitlist/join$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # Phone OTP: SMS cost on the way in, credential guessing on the way back.
    location ~ ^(/[^/]+)?/my/login$ {
        limit_req zone=modryn_otp burst=3 nodelay;
        proxy_pass http://modryn_odoo;
    }
    location ~ ^(/[^/]+)?/my/verify$ {
        limit_req zone=modryn_otp burst=3 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # Staff password login. This is also the surface the fail2ban jail watches;
    # the rate limit slows a script down, fail2ban removes the persistent one.
    location ~ ^(/[^/]+)?/staff/login$ {
        limit_req zone=modryn_otp burst=3 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # Token-addressed mutations. These were never `location =` matchable at all,
    # because the token is in the path.
    #
    # /b/<token>/confirm and /b/<token>/cancel mutate a booking; /claim/<token>
    # consumes a waitlist offer, which is a real resource someone else is
    # waiting for.
    location ~ ^(/[^/]+)?/b/[^/]+/(confirm|cancel)$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }
    location ~ ^(/[^/]+)?/claim/[^/]+$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }
    # /my/cancel/<id> POST is also auth='public' and also mutates a booking.
    # It is guessable by integer id in a way the token routes are not, so it
    # gets a limit too.
    location ~ ^(/[^/]+)?/my/cancel/[0-9]+$ {
        limit_req zone=modryn_post burst=5 nodelay;
        proxy_pass http://modryn_odoo;
    }

    # -----------------------------------------------------------------------
    # Websockets -> the gevent process.
    # -----------------------------------------------------------------------
    # Route confirmed in odoo/addons/bus/controllers/websocket.py:
    #   @route('/websocket', type="http", auth="public", websocket=True)
    # plus /websocket/health and /websocket/peek_notifications under the same
    # prefix, so `^~` (prefix, beats regex) rather than an exact match.
    location ^~ /websocket {
        proxy_pass http://modryn_odoo_chat;

        # THIS BLOCK MUST REPEAT EVERY HEADER. nginx inherits proxy_set_header
        # from the enclosing level ONLY when the current level sets none of its
        # own — so adding Upgrade here silently drops Host, X-Forwarded-Host,
        # X-Forwarded-Proto and X-Forwarded-For. Losing X-Forwarded-Host
        # disables ProxyFix for websocket handshakes specifically, which is a
        # bug that only ever shows up on the staff floor board.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Odoo's websocket_keep_alive_timeout defaults to 3600 s. nginx must
        # OUTLAST it, or nginx becomes the thing that drops the floor board's
        # connection every hour and the resulting reconnect storm reads as an
        # application bug.
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
        proxy_buffering off;
    }

    # -----------------------------------------------------------------------
    # Filestore, served by nginx on Odoo's behalf (x_sendfile = True).
    # -----------------------------------------------------------------------
    # Odoo emits `X-Accel-Redirect: /web/filestore/<db>/<ab>/<sha>`, built
    # relative to data_dir/filestore (odoo/odoo/http.py), with an empty body —
    # so this alias must resolve to exactly data_dir/filestore.
    # `internal` means only an X-Accel-Redirect can reach it; a direct request
    # to /web/filestore/... gets a 404, which matters because the path is
    # otherwise a content-addressed read of every tenant's attachments.
    location ^~ /web/filestore {
        internal;
        alias /var/lib/modryn/filestore;
        # private, not public: attachments include per-tenant material and some
        # of it is only reachable behind a login.
        add_header Cache-Control "private, max-age=86400";
        # add_header follows the same inheritance rule as proxy_set_header: a
        # level that sets ONE header replaces the whole inherited set. The three
        # server-level security headers are repeated here for that reason, not
        # for style.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -----------------------------------------------------------------------
    # Static assets.
    # -----------------------------------------------------------------------
    # Measured: Odoo already returns
    #   Cache-Control: public, max-age=31536000, immutable
    # on /web/assets/<website_id>/<hash>/<bundle>, and the content hash is in
    # the PATH. Browser caching is therefore already correct and nginx has
    # nothing to add to it.
    #
    # DO NOT add proxy_cache here. Measured: a GET of a CSS bundle came back
    # carrying `Set-Cookie: session_id=...` alongside the immutable header,
    # because Odoo touches the session on that request. nginx refuses to cache
    # a response with Set-Cookie; the usual "fix" — proxy_ignore_headers
    # Set-Cookie — removes that refusal and turns the asset cache into a machine
    # that hands one visitor's session cookie to the next. gzip (conf.d) is the
    # real win and carries none of that risk.
    location ^~ /web/assets/ {
        proxy_pass http://modryn_odoo;
    }

    # -----------------------------------------------------------------------
    # Everything else.
    # -----------------------------------------------------------------------
    # /robots.txt is deliberately NOT overridden here. Odoo serves it per
    # website (addons/website/controllers/main.py), so a boutique owner can edit
    # her own; a static file at this level would silently take that away.
    location / {
        proxy_pass http://modryn_odoo;
    }

    # Static, Odoo-independent error pages: a 502 must be a page, not nginx's
    # default. Neither page references /web/assets — that path is exactly what
    # is unavailable when a 502 fires.
    #
    # These only replace errors nginx GENERATES (the tenant-unknown 404 above,
    # 502/504 from a dead upstream). `proxy_intercept_errors` is left off, so a
    # 404 that Odoo itself produces — a missing dress page — still renders the
    # website module's own 404, which the boutique owner can edit. Turning
    # proxy_intercept_errors on would silently take that page away from her.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html { root /var/www/modryn-static; internal; }
    location = /50x.html { root /var/www/modryn-static; internal; }
}
