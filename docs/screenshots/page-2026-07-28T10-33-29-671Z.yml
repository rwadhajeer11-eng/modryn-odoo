            - listitem [ref=f1e187]: "בעמוד הקולקציה הטקסט החלופי של כל תצלום הוא שם השמלה בלבד, ואינו מתאר את הגזרה, הבד או הפרטים. בעמוד השמלה התצלומים מוקראים לפי מיקומם בגלריה, למשל: תמונה 1 מתוך 3, ושם השמלה מופיע בכותרת העמוד. נשמח לתאר כל שמלה בטלפון."
