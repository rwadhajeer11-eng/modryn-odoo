          - heading "הצהרת נגישות" [level=1] [ref=f1e157]
          - paragraph [ref=f1e158]: Bella Bridal
          - paragraph [ref=f1e159]: אנחנו מאמינות שכל אחת ואחד צריכים להיות מסוגלים לגלוש כאן, לראות את השמלות ולקבוע תור — בלי מחסומים. השקענו מאמץ כדי שהאתר יהיה נגיש, ואנחנו ממשיכות לשפר אותו.
        - generic [ref=f1e160]:
          - heading "רמת הנגישות של האתר" [level=2] [ref=f1e162]
          - paragraph [ref=f1e163]: האתר נבנה בהתאם לתקן הישראלי ת״י 5568 ברמת AA, המבוסס על הנחיות WCAG 2.0 של ארגון התקינה W3C.
        - generic [ref=f1e164]:
          - heading "מה עשינו כדי להנגיש את האתר" [level=2] [ref=f1e166]
          - list [ref=f1e167]:
            - listitem [ref=f1e168]: הגופנים העבריים מתארחים בשרת שלנו ואינם נטענים משירות חיצוני, כדי שהטקסט יופיע מיד ובצורה קריאה גם בחיבור איטי.
            - listitem [ref=f1e169]: אפשר להפעיל את כל האתר במקלדת בלבד. סדר המעבר בין הרכיבים תואם לסדר שרואים על המסך, ולכל רכיב פעיל יש סימון מיקוד ברור. בראש כל עמוד יש קישור דילוג ישירות אל התוכן.
            - listitem [ref=f1e170]: כל צירופי הצבעים באתר נבדקו ועומדים ביחס ניגודיות של 4.5:1 לפחות בטקסט רגיל.
            - listitem [ref=f1e171]: האתר כולו בעברית ובכיוון מימין לשמאל, כולל האזורים שמכילים ספרות, מספרי טלפון וכתובות אינטרנט באנגלית.
            - listitem [ref=f1e172]: לכל תצלום שמלה יש טקסט חלופי, וקישוטים גרפיים מוסתרים מקוראי מסך כדי לא להעמיס.
            - listitem [ref=f1e173]: באתר תפריט נגישות משלנו — לא הרחבה חיצונית — הזמין בכל עמוד בפינה התחתונה.
          - heading "מה עושה כל אפשרות בתפריט הנגישות" [level=3] [ref=f1e174]
          - list [ref=f1e175]:
            - listitem [ref=f1e176]: ניגודיות גבוהה — מחזקת את הניגוד בין הטקסט לרקע.
            - listitem [ref=f1e177]: הגדלת טקסט — מגדילה את כל הטקסטים באתר.
            - listitem [ref=f1e178]: גופן קריא — מחליף את הגופן העיצובי בגופן פשוט וברור יותר.
            - listitem [ref=f1e179]: הדגשת קישורים — מוסיפה קו תחתון לכל הקישורים כדי שיבלטו בתוך הטקסט.
            - listitem [ref=f1e180]: עצירת אנימציות — מבטלת מעברים ותנועה באתר.
          - paragraph [ref=f1e181]: ההעדפות חלות על הגלישה הנוכחית בלבד ואינן נשמרות במכשיר, מפני שאיננו שומרים מידע על הגולשים.
