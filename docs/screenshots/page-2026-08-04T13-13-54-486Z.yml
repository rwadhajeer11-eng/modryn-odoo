          - heading "הודעת פרטיות" [level=1] [ref=f9e8]
          - paragraph [ref=f9e9]: בוטיק מודרין
        - generic [ref=f9e10]:
          - heading "המידע שאנחנו אוספות ומה אנחנו עושות בו" [level=2] [ref=f9e12]
          - paragraph [ref=f9e13]: הפרטים שאת מוסרת לנו נשמרים אצל ⁨בוטיק מודרין⁩. הבוטיק הוא בעל המאגר והאחראי למידע שבו, ואנחנו משתמשות בפרטים כדי לקבוע את התור שלך ולנהל אותו, ולא לשום מטרה אחרת — למעט פניות שיווקיות, ורק אם סימנת בעצמך את תיבת ההסכמה. מסירת הפרטים היא מרצון, ובכל עת אפשר לבקש מאיתנו לעיין במידע שנשמר עלייך, לתקן אותו או למחוק אותו.
          - paragraph [ref=f9e14]: "מה אנחנו מבקשות, ולמה: • שם מלא — כדי לרשום את התור על שמך ולקרוא לך בשמך כשתגיעי. • מספר טלפון נייד — כדי לשלוח קוד אימות חד-פעמי לפני קביעת התור, לאשר לך את המועד, לשלוח תזכורת לקראתו וליצור איתך קשר אם משהו משתנה. • סוג הפגישה, המועד, השמלה והמידה שבחרת, וכל מה שסיפרת לנו מראש — כדי להכין את הביקור."
          - paragraph [ref=f9e15]: אין חובה חוקית למסור לנו את הפרטים האלה, וההחלטה היא שלך. בלי שם ובלי מספר נייד לא נוכל לקבוע לך תור באתר — אי אפשר לאמת את המספר, לשמור לך את המועד או לעדכן אותך אם משהו משתנה. תמיד אפשר לפנות אלינו ולקבוע תור ישירות מול הבוטיק.
          - paragraph [ref=f9e16]: "למי המידע מגיע: • לצוות הבוטיק, לפי התפקיד של כל אחת. • לחברה שמפעילה עבורנו את האתר ואת מערכת התורים, ולספקי התשתית שהיא נעזרת בהם כדי לאחסן את המידע ולשלוח אלייך את המסרונים. הם מעבדים את המידע עבורנו בלבד ולפי הוראותינו. • לגורם שאנחנו חייבות למסור לו מידע לפי דין, אם נידרש לכך."
          - paragraph [ref=f9e17]: איננו מוכרות את הפרטים שלך ואיננו מעבירות אותם למפרסמים.
          - paragraph [ref=f9e18]: את פרטי התור ואת ההודעות ששלחנו לך אנחנו שומרות כל עוד הם דרושים לניהול הביקורים ולחובות הרישום והדיווח שחלות עלינו. אפשר לבקש מחיקה גם לפני כן, וכך נעשה — למעט מידע שאנחנו חייבות לשמור לפי דין, שיישמר בלי שמך ובלי מספר הטלפון שלך.
          - paragraph [ref=f9e19]: "הזכויות שלך: • לעיין במידע שנשמר עלייך. • לבקש לתקן מידע שאינו מדויק. • לבקש למחוק את המידע."
          - paragraph [ref=f9e20]: כדי לממש כל אחת מהזכויות האלה אפשר לפנות אלינו ישירות — בבוטיק, או בפרטי הקשר שמופיעים באתר. נבקש לוודא את זהותך לפני שנמסור מידע או נמחק אותו, כדי שהפרטים שלך לא יגיעו לאדם אחר, ונשיב לפנייה בתוך שלושים יום.
          - paragraph [ref=f9e21]: הפרטים שלך לא ישמשו לפניות שיווקיות אלא אם סימנת בעצמך את תיבת ההסכמה שבטופס קביעת התור. התיבה אינה מסומנת מראש, וקביעת התור אינה תלויה בה.
          - paragraph [ref=f9e22]: אם סימנת אותה ואת רוצה להפסיק — אפשר לבקש מאיתנו להסיר את ההסכמה בכל עת, בטלפון או בבוטיק. אין צורך להסביר למה, אפשר לומר זאת לכל אחת מאיתנו, וההסרה נכנסת לתוקף מיד. הסרת ההסכמה אינה משפיעה על התור שלך או על השירות שאת מקבלת.
        - generic [ref=f9e23]:
          - heading "מי מעבד את המידע ואיך הוא נשמר" [level=2] [ref=f9e25]
          - paragraph [ref=f9e26]: הבוטיק הוא בעל המאגר והאחראי למידע שנאסף באתר הזה. את אתר הבוטיק, את מערכת התורים ואת משלוח ההודעות מפעילה עבורנו MODRYN, מפעילת הפלטפורמה, שמחזיקה במידע ומעבדת אותו עבורנו בלבד ולפי הוראותינו.
          - paragraph [ref=f9e27]: MODRYN אינה רשאית להשתמש במידע למטרות משלה, למכור אותו או להעביר אותו לאחרים — למעט ספקי התשתית שרשומים בהמשך, ולמעט מסירה שאנחנו או היא חייבות בה לפי דין. ההתקשרות איתה כוללת התחייבות לשמירת סודיות ולנקיטת אמצעי אבטחה.
          - paragraph [ref=f9e28]: "אלה אמצעי האבטחה שננקטים בפועל: • הגישה למידע ניתנת רק לצוות הבוטיק, לפי התפקיד של כל אחת, ומחייבת כניסה אישית עם סיסמה. • המידע של כל בוטיק מופרד מהמידע של בוטיקים אחרים ברמת בסיס הנתונים. • התקשורת בין הדפדפן לשרת מוצפנת. • סיסמאות נשמרות בגיבוב חד-כיווני ולא בטקסט גלוי. • פעולות שינוי ומחיקה שהצוות מבצע במידע של לקוחה נרשמות ביומן פעילות."
          - paragraph [ref=f9e29]: אם יתרחש אירוע אבטחה שיש בו חשש לפגיעה במידע שלך, ניידע אותך ואת הרשות להגנת הפרטיות כנדרש לפי דין.
        - generic [ref=f9e30]:
          - heading "ספקי התשתית" [level=2] [ref=f9e32]
          - paragraph [ref=f9e33]: כדי להפעיל את השירות אנחנו נעזרות בספקי תשתית. הרשימה הזאת נקבעת על ידי מפעילת הפלטפורמה, היא זהה בכל הבוטיקים שמשתמשים בפלטפורמה, והיא מתעדכנת כשמצטרף ספק חדש. לצד כל ספק כתוב גם אם הוא בשימוש כיום.
          - paragraph [ref=f9e34]: • אחסון והפעלה — חברת Railway מפעילה את השרתים ואת בסיס הנתונים שבו נשמרים הפרטים שמסרת. שרתיה ממוקמים מחוץ לישראל, ולכן המידע מועבר ונשמר מחוץ לגבולות המדינה. • משלוח הודעות SMS — כשמשלוח ההודעות מופעל, חברת Twilio מקבלת את מספר הטלפון שלך ואת תוכן ההודעה, לצורך שליחת קוד האימות, אישור התור והתזכורות בלבד. גם היא פועלת מחוץ לישראל. כשהמשלוח אינו מופעל, לא נשלחות הודעות ולא מועבר אליה מידע. • אחסון תצלומים — שירותי האחסון של Amazon Web Services שומרים את תצלומי השמלות של הקולקציה, באזור השירות שבישראל. אין בהם שם, מספר טלפון או כל פרט אחר שלך.
          - paragraph [ref=f9e35]: בשלב זה איננו נעזרות בשירות סליקה או תשלומים, ולא נאספים באתר פרטי אמצעי תשלום. אם יתווסף שירות כזה, הוא יופיע ברשימה הזאת לפני שייעשה בו שימוש.
