        - heading "פרטים" [level=1] [ref=f7e181]
        - generic [ref=f7e182]:
          - heading "המידע שאת מוסרת לנו" [level=2] [ref=f7e183]
          - paragraph [ref=f7e184]: הפרטים שאת מוסרת לנו נשמרים אצל ⁨בוטיק מודרין⁩. הבוטיק הוא בעל המאגר והאחראי למידע שבו, ואנחנו משתמשות בפרטים כדי לקבוע את התור שלך ולנהל אותו, ולא לשום מטרה אחרת — למעט פניות שיווקיות, ורק אם סימנת בעצמך את תיבת ההסכמה. מסירת הפרטים היא מרצון, ובכל עת אפשר לבקש מאיתנו לעיין במידע שנשמר עלייך, לתקן אותו או למחוק אותו.
          - paragraph [ref=f7e185]: "מה אנחנו מבקשות, ולמה: • שם מלא — כדי לרשום את התור על שמך ולקרוא לך בשמך כשתגיעי. • מספר טלפון נייד — כדי לשלוח קוד אימות חד-פעמי לפני קביעת התור, לאשר לך את המועד, לשלוח תזכורת לקראתו וליצור איתך קשר אם משהו משתנה. • סוג הפגישה, המועד, השמלה והמידה שבחרת, וכל מה שסיפרת לנו מראש — כדי להכין את הביקור."
          - paragraph [ref=f7e186]: אין חובה חוקית למסור לנו את הפרטים האלה, וההחלטה היא שלך. בלי שם ובלי מספר נייד לא נוכל לקבוע לך תור באתר — אי אפשר לאמת את המספר, לשמור לך את המועד או לעדכן אותך אם משהו משתנה. תמיד אפשר לפנות אלינו ולקבוע תור ישירות מול הבוטיק.
          - paragraph [ref=f7e187]: "למי המידע מגיע: • לצוות הבוטיק, לפי התפקיד של כל אחת. • לחברה שמפעילה עבורנו את האתר ואת מערכת התורים, ולספקי התשתית שהיא נעזרת בהם כדי לאחסן את המידע ולשלוח אלייך את המסרונים. הם מעבדים את המידע עבורנו בלבד ולפי הוראותינו. • לגורם שאנחנו חייבות למסור לו מידע לפי דין, אם נידרש לכך."
          - paragraph [ref=f7e188]: איננו מוכרות את הפרטים שלך ואיננו מעבירות אותם למפרסמים.
          - paragraph [ref=f7e189]: את פרטי התור ואת ההודעות ששלחנו לך אנחנו שומרות כל עוד הם דרושים לניהול הביקורים ולחובות הרישום והדיווח שחלות עלינו. אפשר לבקש מחיקה גם לפני כן, וכך נעשה — למעט מידע שאנחנו חייבות לשמור לפי דין, שיישמר בלי שמך ובלי מספר הטלפון שלך.
          - paragraph [ref=f7e190]: "הזכויות שלך: • לעיין במידע שנשמר עלייך. • לבקש לתקן מידע שאינו מדויק. • לבקש למחוק את המידע."
          - paragraph [ref=f7e191]: כדי לממש כל אחת מהזכויות האלה אפשר לפנות אלינו ישירות — בבוטיק, או בפרטי הקשר שמופיעים באתר. נבקש לוודא את זהותך לפני שנמסור מידע או נמחק אותו, כדי שהפרטים שלך לא יגיעו לאדם אחר, ונשיב לפנייה בתוך שלושים יום.
          - paragraph [ref=f7e192]: הפרטים שלך לא ישמשו לפניות שיווקיות אלא אם סימנת בעצמך את תיבת ההסכמה שבטופס קביעת התור. התיבה אינה מסומנת מראש, וקביעת התור אינה תלויה בה.
          - paragraph [ref=f7e193]: אם סימנת אותה ואת רוצה להפסיק — אפשר לבקש מאיתנו להסיר את ההסכמה בכל עת, בטלפון או בבוטיק. אין צורך להסביר למה, אפשר לומר זאת לכל אחת מאיתנו, וההסרה נכנסת לתוקף מיד. הסרת ההסכמה אינה משפיעה על התור שלך או על השירות שאת מקבלת.
