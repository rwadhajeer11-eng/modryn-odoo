            - textbox "סעיף עיבוד המידע" [ref=f15e1382]: "הבוטיק הוא בעל המאגר והאחראי למידע שנאסף באתר הזה. את אתר הבוטיק, את מערכת התורים ואת משלוח ההודעות מפעילה עבורנו MODRYN, מפעילת הפלטפורמה, שמחזיקה במידע ומעבדת אותו עבורנו בלבד ולפי הוראותינו. MODRYN אינה רשאית להשתמש במידע למטרות משלה, למכור אותו או להעביר אותו לאחרים — למעט ספקי התשתית שרשומים בהמשך, ולמעט מסירה שאנחנו או היא חייבות בה לפי דין. ההתקשרות איתה כוללת התחייבות לשמירת סודיות ולנקיטת אמצעי אבטחה. אלה אמצעי האבטחה שננקטים בפועל: • הגישה למידע ניתנת רק לצוות הבוטיק, לפי התפקיד של כל אחת, ומחייבת כניסה אישית עם סיסמה. • המידע של כל בוטיק מופרד מהמידע של בוטיקים אחרים ברמת בסיס הנתונים. • התקשורת בין הדפדפן לשרת מוצפנת. • סיסמאות נשמרות בגיבוב חד-כיווני ולא בטקסט גלוי. • פעולות שינוי ומחיקה שהצוות מבצע במידע של לקוחה נרשמות ביומן פעילות. אם יתרחש אירוע אבטחה שיש בו חשש לפגיעה במידע שלך, ניידע אותך ואת הרשות להגנת הפרטיות כנדרש לפי דין."
          - paragraph [ref=f15e1383]: 1544 מתוך 8192 בתים
