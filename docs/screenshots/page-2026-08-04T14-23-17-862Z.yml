      - generic [ref=f15e1387]:
        - heading "ספקי התשתית" [level=3] [ref=f15e1388]
        - paragraph [ref=f15e1389]: כדי להפעיל את השירות אנחנו נעזרות בספקי תשתית. הרשימה הזאת נקבעת על ידי מפעילת הפלטפורמה, היא זהה בכל הבוטיקים שמשתמשים בפלטפורמה, והיא מתעדכנת כשמצטרף ספק חדש. לצד כל ספק כתוב גם אם הוא בשימוש כיום. • אחסון והפעלה — חברת Railway מפעילה את השרתים ואת בסיס הנתונים שבו נשמרים הפרטים שמסרת. שרתיה ממוקמים מחוץ לישראל, ולכן המידע מועבר ונשמר מחוץ לגבולות המדינה. • משלוח הודעות SMS — כשמשלוח ההודעות מופעל, חברת Twilio מקבלת את מספר הטלפון שלך ואת תוכן ההודעה, לצורך שליחת קוד האימות, אישור התור והתזכורות בלבד. גם היא פועלת מחוץ לישראל. כשהמשלוח אינו מופעל, לא נשלחות הודעות ולא מועבר אליה מידע. • אחסון תצלומים — שירותי האחסון של Amazon Web Services שומרים את תצלומי השמלות של הקולקציה, באזור השירות שבישראל. אין בהם שם, מספר טלפון או כל פרט אחר שלך. בשלב זה איננו נעזרות בשירות סליקה או תשלומים, ולא נאספים באתר פרטי אמצעי תשלום. אם יתווסף שירות כזה, הוא יופיע ברשימה הזאת לפני שייעשה בו שימוש.
