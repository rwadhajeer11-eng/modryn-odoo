        - heading "הודעת הפרטיות של הבוטיק" [level=2] [ref=f15e1368]
        - paragraph [ref=f15e1369]: הנוסח שמופיע כאן הוא ברירת מחדל שהכינה מפעילת הפלטפורמה. הוא לא נבדק על ידי עורך דין ואינו ייעוץ משפטי. הבוטיק הוא בעל המאגר והאחראי החוקי למידע של הלקוחות, ולכן האחריות על מה שכתוב בהודעת הפרטיות שלו היא של הבוטיק. מומלץ להעביר את הנוסח לעורך דין לפני שמסתמכים עליו, ולוודא שהוא מתאר את מה שהבוטיק באמת עושה עם המידע. אפשר לערוך כאן את הודעת הפרטיות ואת סעיף עיבוד המידע. רשימת ספקי התשתית נקבעת על ידי מפעילת הפלטפורמה ואי אפשר לערוך אותה — כך היא נשארת נכונה בכל הבוטיקים כשמצטרף ספק חדש. שדה שנשאר ריק חוזר לנוסח ברירת המחדל.
        - generic [ref=f15e1370]:
          - generic [ref=f15e1371]: נוסח ברירת מחדל
          - generic [ref=f15e1373]:
            - generic [ref=f15e1374]: הודעת הפרטיות
            - textbox "הודעת הפרטיות" [ref=f15e1375]: "הפרטים שאת מוסרת לנו נשמרים אצל {{boutique}}. הבוטיק הוא בעל המאגר והאחראי למידע שבו, ואנחנו משתמשות בפרטים כדי לקבוע את התור שלך ולנהל אותו, ולא לשום מטרה אחרת — למעט פניות שיווקיות, ורק אם סימנת בעצמך את תיבת ההסכמה. מסירת הפרטים היא מרצון, ובכל עת אפשר לבקש מאיתנו לעיין במידע שנשמר עלייך, לתקן אותו או למחוק אותו. מה אנחנו מבקשות, ולמה: • שם מלא — כדי לרשום את התור על שמך ולקרוא לך בשמך כשתגיעי. • מספר טלפון נייד — כדי לשלוח קוד אימות חד-פעמי לפני קביעת התור, לאשר לך את המועד, לשלוח תזכורת לקראתו וליצור איתך קשר אם משהו משתנה. • סוג הפגישה, המועד, השמלה והמידה שבחרת, וכל מה שסיפרת לנו מראש — כדי להכין את הביקור. אין חובה חוקית למסור לנו את הפרטים האלה, וההחלטה היא שלך. בלי שם ובלי מספר נייד לא נוכל לקבוע לך תור באתר — אי אפשר לאמת את המספר, לשמור לך את המועד או לעדכן אותך אם משהו משתנה. תמיד אפשר לפנות אלינו ולקבוע תור ישירות מול הבוטיק. למי המידע מגיע: • לצוות הבוטיק, לפי התפקיד של כל אחת. • לחברה שמפעילה עבורנו את האתר ואת מערכת התורים, ולספקי התשתית שהיא נעזרת בהם כדי לאחסן את המידע ולשלוח אלייך את המסרונים. הם מעבדים את המידע עבורנו בלבד ולפי הוראותינו. • לגורם שאנחנו חייבות למסור לו מידע לפי דין, אם נידרש לכך. איננו מוכרות את הפרטים שלך ואיננו מעבירות אותם למפרסמים. את פרטי התור ואת ההודעות ששלחנו לך אנחנו שומרות כל עוד הם דרושים לניהול הביקורים ולחובות הרישום והדיווח שחלות עלינו. אפשר לבקש מחיקה גם לפני כן, וכך נעשה — למעט מידע שאנחנו חייבות לשמור לפי דין, שיישמר בלי שמך ובלי מספר הטלפון שלך. הזכויות שלך: • לעיין במידע שנשמר עלייך. • לבקש לתקן מידע שאינו מדויק. • לבקש למחוק את המידע. כדי לממש כל אחת מהזכויות האלה אפשר לפנות אלינו ישירות — בבוטיק, או בפרטי הקשר שמופיעים באתר. נבקש לוודא את זהותך לפני שנמסור מידע או נמחק אותו, כדי שהפרטים שלך לא יגיעו לאדם אחר, ונשיב לפנייה בתוך שלושים יום. הפרטים שלך לא ישמשו לפניות שיווקיות אלא אם סימנת בעצמך את תיבת ההסכמה שבטופס קביעת התור. התיבה אינה מסומנת מראש, וקביעת התור אינה תלויה בה. אם סימנת אותה ואת רוצה להפסיק — אפשר לבקש מאיתנו להסיר את ההסכמה בכל עת, בטלפון או בבוטיק. אין צורך להסביר למה, אפשר לומר זאת לכל אחת מאיתנו, וההסרה נכנסת לתוקף מיד. הסרת ההסכמה אינה משפיעה על התור שלך או על השירות שאת מקבלת."
          - paragraph [ref=f15e1376]: 3746 מתוך 8192 בתים
        - generic [ref=f15e1377]:
